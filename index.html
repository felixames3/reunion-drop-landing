<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felix Ames — Did The Rain Stop?</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Barlow+Condensed:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bone: #F0EAE0;
      --bone-dim: rgba(240, 234, 224, 0.55);
      --bone-faint: rgba(240, 234, 224, 0.3);
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #0D0B08;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--bone);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* ---- BACKGROUND PHOTO ---- */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center 30%;
      z-index: 0;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(10, 8, 5, 0.82) 0%,
          rgba(10, 8, 5, 0.55) 35%,
          rgba(10, 8, 5, 0.60) 60%,
          rgba(10, 8, 5, 0.90) 100%
        );
    }

    /* Film grain overlay */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.045;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    /* ---- LAYOUT ---- */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    /* ---- TOP MARK ---- */
    .top-mark {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 0.28em;
      color: var(--bone-dim);
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* ---- MAIN CONTENT ---- */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .artist-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--bone-dim);
      margin-bottom: 18px;
    }

    .album-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 7vw, 58px);
      font-weight: 300;
      line-height: 1.1;
      color: var(--bone);
      letter-spacing: 0.03em;
      margin-bottom: 20px;
    }

    .drop-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--bone-faint);
      margin-bottom: 40px;
    }

    .rule {
      width: 40px;
      height: 0.5px;
      background: var(--bone-faint);
      margin-bottom: 40px;
    }

    .body-copy {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.8;
      color: var(--bone-dim);
      letter-spacing: 0.04em;
      margin-bottom: 44px;
    }

    /* ---- SHARED INPUT STYLE ---- */
    .text-input {
      width: 100%;
      background: rgba(240, 234, 224, 0.06);
      border: 0.5px solid rgba(240, 234, 224, 0.25);
      border-radius: 0;
      padding: 14px 18px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      letter-spacing: 0.06em;
      color: var(--bone);
      outline: none;
      transition: border-color 0.25s, background 0.25s;
      text-align: center;
      -webkit-appearance: none;
    }

    .text-input::placeholder {
      color: rgba(240, 234, 224, 0.3);
      letter-spacing: 0.12em;
      font-size: 12px;
      text-transform: uppercase;
    }

    .text-input:focus {
      border-color: rgba(240, 234, 224, 0.5);
      background: rgba(240, 234, 224, 0.09);
    }

    /* ---- BUTTONS ---- */
    .submit-btn {
      width: 100%;
      background: transparent;
      border: 0.5px solid rgba(240, 234, 224, 0.4);
      padding: 13px 18px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--bone);
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
    }

    .submit-btn:hover {
      background: rgba(240, 234, 224, 0.08);
      border-color: rgba(240, 234, 224, 0.65);
    }

    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Solid buy button — inverted for emphasis */
    .buy-btn {
      width: 100%;
      max-width: 340px;
      background: var(--bone);
      border: 0.5px solid var(--bone);
      padding: 16px 18px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #0D0B08;
      cursor: pointer;
      transition: opacity 0.25s;
      margin-bottom: 10px;
    }

    .buy-btn:hover { opacity: 0.88; }

    .buy-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ---- STATUS MESSAGES ---- */
    .status-msg {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: var(--bone-dim);
      text-align: center;
      min-height: 20px;
      font-style: italic;
    }

    .status-msg.success { color: rgba(210, 195, 160, 0.8); }
    .status-msg.error   { color: rgba(200, 160, 130, 0.8); }

    /* ---- WAITLIST FORM ---- */
    .form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .consent-note {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.05em;
      color: rgba(240, 234, 224, 0.18);
      text-align: center;
      line-height: 1.7;
      margin-top: -4px;
    }

    /* ---- LIVE DROP SECTION ---- */
    #liveDrop { display: none; width: 100%; align-items: center; flex-direction: column; }

    .buy-status {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: var(--bone-dim);
      font-style: italic;
      min-height: 20px;
      text-align: center;
      margin-bottom: 44px;
    }

    .buy-status.error { color: rgba(200, 160, 130, 0.8); }

    .future-drops {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding-top: 40px;
      border-top: 0.5px solid rgba(240, 234, 224, 0.1);
    }

    .future-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--bone-faint);
      margin-bottom: 20px;
    }

    /* ---- BOTTOM MARK ---- */
    .bottom-mark {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 0.25em;
      color: rgba(240, 234, 224, 0.18);
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* ---- MOBILE ---- */
    @media (max-width: 480px) {
      .page { padding: 80px 28px 80px; }
      .album-title { font-size: 40px; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="grain"></div>

  <div class="top-mark">REUNION — 001</div>

  <div class="page">
    <div class="content">

      <div class="artist-name">Felix Ames</div>
      <h1 class="album-title">Did The Rain Stop?</h1>
      <div class="drop-label">Reunion Drop 001</div>

      <div class="rule"></div>

      <!-- =====================================================
           PRE-DROP STATE
           Shown when DROP_LIVE = false (see config below)
      ====================================================== -->
      <div id="preDrop">
        <p class="body-copy">Vinyls coming soon.<br>Be the first to know when they drop.</p>

        <form class="form" id="waitlistForm">
          <input
            class="text-input"
            type="email"
            id="emailInput"
            placeholder="Your email"
            required
            autocomplete="email"
          />
          <input
            class="text-input"
            type="tel"
            id="phoneInput"
            placeholder="Phone (optional)"
            autocomplete="tel"
          />
          <p class="consent-note">
            By adding your number you agree to receive<br>
            texts about future drops. Reply STOP to opt out.
          </p>
          <button class="submit-btn" type="submit" id="submitBtn">
            Join the List
          </button>
          <div class="status-msg" id="statusMsg"></div>
        </form>
      </div>

      <!-- =====================================================
           LIVE DROP STATE
           Shown when DROP_LIVE = true (see config below)
      ====================================================== -->
      <div id="liveDrop">
        <p class="body-copy">Limited pressing. Ships in 2–3 weeks.</p>

        <button class="buy-btn" id="buyBtn">Buy Now — $28</button>
        <div class="buy-status" id="buyStatus"></div>

        <div class="future-drops">
          <div class="future-label">Stay updated on future drops</div>
          <form class="form" id="futureForm">
            <input
              class="text-input"
              type="email"
              id="futureEmailInput"
              placeholder="Your email"
              required
              autocomplete="email"
            />
            <button class="submit-btn" type="submit" id="futureSubmitBtn">
              Notify Me
            </button>
            <div class="status-msg" id="futureStatusMsg"></div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <div class="bottom-mark">Felix Ames</div>

  <script>
    // =========================================================
    // CONFIG — fill these in before going live
    // =========================================================

    const DROP_LIVE = true;
    // Flip to true on drop day. Everything else switches automatically.

    const CHECKOUT_URL = 'https://qcj2dh-wk.myshopify.com/cart/47291145781379:1';
    // Direct checkout link — sends buyer straight to Shopify checkout

    const VINYL_PRICE = '$35.95';
    // Display only — Shopify controls the real price at checkout

    // =========================================================
    // END CONFIG
    // =========================================================

    const SIGNUP_URL = 'https://reunion-command-center.vercel.app/api/email-signup';

    document.addEventListener('DOMContentLoaded', () => {

      if (DROP_LIVE) {
        document.getElementById('preDrop').style.display  = 'none';
        document.getElementById('liveDrop').style.display = 'flex';
        document.getElementById('buyBtn').textContent = `Buy Now — ${VINYL_PRICE}`;
        document.getElementById('buyBtn').addEventListener('click', () => {
          window.location.href = CHECKOUT_URL;
        });
      }

      // ---- Waitlist form (pre-drop) ----
      document.getElementById('waitlistForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email  = document.getElementById('emailInput').value.trim();
        const phone  = document.getElementById('phoneInput').value.trim();
        const btn    = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        if (!email) return;
        await submitSignup({ email, phone, source: 'reunion-landing-waitlist', btn, status });
      });

      // ---- Future drops form (live state) ----
      document.getElementById('futureForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email  = document.getElementById('futureEmailInput').value.trim();
        const btn    = document.getElementById('futureSubmitBtn');
        const status = document.getElementById('futureStatusMsg');
        if (!email) return;
        await submitSignup({ email, source: 'reunion-landing-futuredrops', btn, status });
      });

    });

    // ---- Shared signup handler ----
    async function submitSignup({ email, phone, source, btn, status }) {
      btn.disabled    = true;
      btn.textContent = 'Adding...';
      status.className   = 'status-msg';
      status.textContent = '';

      const body = { email, source };
      if (phone) body.phone = phone;

      try {
        const res = await fetch(SIGNUP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (!res.ok) throw new Error('bad response');

        status.className   = 'status-msg success';
        status.textContent = 'Thank you, talk soon! <3';
        document.getElementById('emailInput') && (document.getElementById('emailInput').value = '');
        document.getElementById('futureEmailInput') && (document.getElementById('futureEmailInput').value = '');
        btn.textContent = 'Done';
      } catch {
        status.className   = 'status-msg error';
        status.textContent = 'Something went wrong. Try again.';
        btn.disabled    = false;
        btn.textContent = btn.dataset.label || 'Join the List';
      }
    }

  </script>

</body>
</html>
